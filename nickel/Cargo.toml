[package]
name = "nickel-lang"
description = "Stable library interface to the Nickel language"
version = "2.2.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["malachite"]
# The arithmetic backend of Nickel numbers. See the features of nickel-lang-parser.
malachite = ["nickel-lang-core/malachite"]
dashu = ["nickel-lang-core/dashu"]
capi = []

[dependencies]
codespan-reporting.workspace = true
indexmap.workspace = true
nickel-lang-core.workspace = true
nickel-lang-vector.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
