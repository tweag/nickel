[package]
name = "nickel-lang-parser"
description = "The Nickel parser"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["malachite"]
# The arithmetic backend of Nickel numbers. Exactly one is needed; if both are
# enabled, malachite is used. malachite is licensed under the LGPL-3.0 and dashu
# under MIT or Apache-2.0. Both give the same results.
malachite = ["dep:malachite"]
dashu = ["dep:dashu-base", "dep:dashu-float", "dep:dashu-int", "dep:dashu-ratio"]
metrics = ["dep:metrics", "dep:metrics-util"]
clap = ["dep:clap"]
nix-experimental = []

[dependencies]
bumpalo.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
codespan.workspace = true
codespan-reporting.workspace = true
dashu-base = { workspace = true, optional = true }
dashu-float = { workspace = true, optional = true }
dashu-int = { workspace = true, optional = true }
dashu-ratio = { workspace = true, optional = true }
indexmap.workspace = true
lalrpop-util.workspace = true
logos.workspace = true
malachite = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
metrics-util = { workspace = true, optional = true }
nickel-lang-vector.workspace = true
ouroboros.workspace = true
pretty.workspace = true
regex.workspace = true
saphyr-parser.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
simple-counter.workspace = true
toml_edit.workspace = true
typed-arena.workspace = true

[build-dependencies]
lalrpop.workspace = true

[dev-dependencies]
assert_matches.workspace = true
nickel-lang-utils.workspace = true
test-generator.workspace = true
indoc.workspace = true
insta = { workspace = true, features = ["filters"] }
pretty_assertions.workspace = true
